name: Docker PostGIS CI

on:
  workflow_dispatch:
    inputs:
      postgres:
        description: 'Postgres version to build (e.g. 15). Leave blank to build all.'
        required: false
        default: ''
      postgis:
        description: 'PostGIS version to build (e.g. 3.4). Leave blank to build all.'
        required: false
        default: ''
      variant:
        description: 'Variant to build (default or alpine). Leave blank to build all.'
        required: false
        default: ''

env:
  IMAGE_NAME: postgis

jobs:

  build:
    strategy:
      matrix:
        runner-platform: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        postgres: [14, 15, 16, 17]
        postgis: ['3.5']
        variant: [default, alpine]
        include:
          - postgres: 18
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 17
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 18
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 17
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 17
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 17
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 18
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 18
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 18
            postgis: '3.6'
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 18
            postgis: '3.6'
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 15
            postgis: '3.4'
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 15
            postgis: '3.4'
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 15
            postgis: '3.4'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 15
            postgis: '3.4'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 16
            postgis: '3.4'
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 16
            postgis: '3.4'
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 16
            postgis: '3.4'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 16
            postgis: '3.4'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 17
            postgis: '3.4'
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 17
            postgis: '3.4'
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 17
            postgis: '3.4'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 17
            postgis: '3.4'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'


    name: Build docker image for ${{ matrix.postgres }}-${{ matrix.postgis }} variant ${{ matrix.variant }}
    runs-on: ${{ matrix.runner-platform }}
    continue-on-error: ${{ matrix.postgis == 'master' }}
    env:
      VERSION: ${{ matrix.postgres }}-${{ matrix.postgis }}
      VARIANT: ${{ matrix.variant }}
      DOCKER_APT_PKG_VER: '5:29.2.1-1~ubuntu.24.04~noble'

    steps:
    - name: Check filter inputs
      id: check_filter
      run: |
        pg_input="${{ github.event.inputs.postgres }}"
        pgis_input="${{ github.event.inputs.postgis }}"
        variant_input="${{ github.event.inputs.variant }}"
        if [[ ( -z "$pg_input" || "$pg_input" == "${{ matrix.postgres }}" ) && \
              ( -z "$pgis_input" || "$pgis_input" == "${{ matrix.postgis }}" ) && \
              ( -z "$variant_input" || "$variant_input" == "${{ matrix.variant }}" ) ]]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping postgres=${{ matrix.postgres }} postgis=${{ matrix.postgis }} variant=${{ matrix.variant }}"
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install/config specific version of Docker packages
      if: steps.check_filter.outputs.run == 'true'
      run: |
        echo "***** Removing any currently installed conflicting packages..."
        for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do sudo apt-get remove $pkg; done
        echo "***** Setting up Docker's APT repo..."
        sudo apt-get update
        sudo apt-get install ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
        echo "*****  Check available docker-ce versions ."
        sudo apt policy docker-ce
        echo "***** Installing Docker packages..."
        sudo apt-get install docker-ce=${{ env.DOCKER_APT_PKG_VER }} docker-ce-cli=${{ env.DOCKER_APT_PKG_VER }} containerd.io docker-buildx-plugin docker-compose-plugin
        echo "***** Verifying initial Docker installation..."
        docker run hello-world
        echo "***** Displaying Docker information..."
        docker info
        echo "***** Configuring Docker for containerd image store and builder keepStorage..."
        echo "{ \"features\": { \"containerd-snapshotter\": true }}" | sudo tee /etc/docker/daemon.json
        echo $'{
          "features": {
            "containerd-snapshotter": true
          },
          "builder": {
            "gc": {
              "defaultKeepStorage": "20GB",
              "enabled": true
            }
          }
        }' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info -f '{{ .DriverStatus }}'

    - name: Load binfmt platforms for QEMU
      if: steps.check_filter.outputs.run == 'true'
      run: |
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker images --tree

    - name: Checkout source
      if: steps.check_filter.outputs.run == 'true'
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      if: steps.check_filter.outputs.run == 'true'
      uses: docker/setup-buildx-action@v1

    - name: Set Context Path
      if: steps.check_filter.outputs.run == 'true'
      id: set-context
      run: |
        if [ "${{ matrix.variant }}" = "default" ]; then
          echo "CONTEXT_PATH=./${{ env.VERSION }}/" >> $GITHUB_ENV
        else
          echo "CONTEXT_PATH=./${{ env.VERSION }}/${{ matrix.variant }}/" >> $GITHUB_ENV
        fi

    - name: Login to GitHub Packages
      if: steps.check_filter.outputs.run == 'true'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build/Push docker image for ${{ env.VERSION }} ${{ env.VARIANT }}
      if: steps.check_filter.outputs.run == 'true'
      uses: docker/build-push-action@v4
      with:
        context: ${{ env.CONTEXT_PATH }}
        push: true
        tags: ghcr.io/iqgeo/docker-postgis/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        build-args: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
        platforms: linux/amd64,linux/arm64

    - name: Logout of GitHub Packages
      if: steps.check_filter.outputs.run == 'true'
      run: docker logout ghcr.io